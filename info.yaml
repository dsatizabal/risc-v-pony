# Tiny Tapeout project information
project:
  title:        "RiscV Pony"                              # Project title
  author:       "Diego Satizabal"                         # Your name
  discord:      "diegosatizabal"                          # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A simple Risc V RV32E implementation"    # One line description of what your project does
  language:     "Verilog"                                 # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000                                  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_dsp_riscv_pony"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "alu.v"
    - "control_unit.v"
    - "core.v"
    - "decoder.v"
    - "gamepad.v"
    - "h_sync_generator.v"
    - "program_counter.v"
    - "project.v"
    - "ram.v"
    - "reg_file.v"
    - "spi_fetcher.v"
    - "timer.v"
    - "vga_peripheral.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PortIn[0]"
  ui[1]: "PortIn[1]"
  ui[2]: "PortIn[2]"
  ui[3]: "PortIn[3]"
  ui[4]: "PortIn[4]"
  ui[5]: "PortIn[5]"
  ui[6]: "PortIn[6]"
  ui[7]: "PortIn[7]"

  # Outputs
  uo[0]: "PortOut[0]"
  uo[1]: "PortOut[1]"
  uo[2]: "PortOut[2]"
  uo[3]: "PortOut[3]"
  uo[4]: "PortOut[4]"
  uo[5]: "PortOut[5]"
  uo[6]: "PortOut[6]"
  uo[7]: "PortOut[7]"

  # Bidirectional pins
  uio[0]: "SPI CS"
  uio[1]: "SPI Clk"
  uio[2]: "SPI MOSI"
  uio[3]: "SPI MOSI"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
